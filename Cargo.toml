[package]
name = "filehalo"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1"
image = {
    version = "0.25.10",
    default-features = false,
    features = ["jpeg", "png", "webp"]
}
libwebp-sys = "0.14.4"
lopdf = { version = "0.45.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Data_Pdf", "Foundation", "Storage", "Storage_Streams", "Win32_System_Com"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
cc = "1"
