[package]
name = "uskko"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
crc32fast = "1"
heic-rs = "0.1.1"
image = {
    version = "0.25.10",
    default-features = false,
    features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"]
}
libwebp-sys = "0.14.4"
lopdf = { version = "0.45.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["bzip2", "ppmd", "deflate", "compress"] }
sha2 = "0.11.0"
# UnRAR 7.21 (с исправлением CVE-2025-8088); вызывается только в режиме
# «проверка», файлы пишет сама программа — см. src/rar.rs.
unrar-ng-sys = "0.7.7"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
windows = { version = "0.62.2", features = [
    "Data_Pdf",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Editing",
    "Media_MediaProperties",
    "Media_Transcoding",
    "Storage",
    "Storage_FileProperties",
    "Storage_Streams",
    "UI",
    "Win32_System_Com",
] }
windows-future = "0.3.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Только для тестов: настоящий диалог «Открыть» и UI Automation.
[dev-dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
cc = "1"
embed-resource = "3"

# Зависимости (графика, картинки, PDF) собираются с оптимизацией и без
# отладочных проверок даже в отладочной сборке: иначе кадр колеса рисуется
# 300 мс вместо 7.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Свой код тоже с лёгкой оптимизацией: попиксельные циклы (вывод кадра,
# текст) в чистой отладочной сборке в десятки раз медленнее. Отладке
# opt-level 1 почти не мешает.
[profile.dev]
opt-level = 1

# Готовая сборка: оптимизация всей программы целиком (LTO) убирает
# неиспользуемый код зависимостей, отладочные символы не нужны.
[profile.release]
lto = true
codegen-units = 1
strip = true
